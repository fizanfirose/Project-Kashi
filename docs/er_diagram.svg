<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960"><rect width="1100" height="960" fill="#f5f7f6"/><style>text{font-family:Arial,sans-serif;fill:#1c3029}.title{font-size:27px;font-weight:bold}.sub{font-size:13px;fill:#697870}.name{font-size:17px;font-weight:bold}.field{font-size:13px}.rel{font-size:12px;fill:#215943}</style><text x="40" y="45" class="title">Project Kashi · Entity relationships</text><text x="40" y="70" class="sub">Core entities and key attributes · Full data dictionary in STUDY_GUIDE.md</text><path d="M 480 210 L 480 245 L 200 245 L 200 290" fill="none" stroke="#91b09b" stroke-width="2"/><text x="240" y="234" class="rel">Branch 1 → 0..many employees</text><path d="M 620 210 L 620 245 L 790 245 L 790 290" fill="none" stroke="#91b09b" stroke-width="2"/><text x="650" y="234" class="rel">Branch 1 → 0..many accounts</text><path d="M 650 355 L 490 355 L 490 550" fill="none" stroke="#91b09b" stroke-width="2"/><text x="500" y="415" class="rel">Account 1 → 1..many holders</text><path d="M 310 615 L 350 615" fill="none" stroke="#91b09b" stroke-width="2"/><text x="65" y="720" class="rel">Customer 1 → 0..many holder rows</text><path d="M 790 420 L 790 550" fill="none" stroke="#91b09b" stroke-width="2"/><text x="800" y="485" class="rel">Account 1 → 0..many entries</text><path d="M 930 355 L 1040 355 L 1040 825 L 930 825" fill="none" stroke="#91b09b" stroke-width="2"/><text x="765" y="920" class="rel">Account 1 → 0..many audit rows</text><rect x="410" y="100" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 420 100 H 680 Q 690 100 690 110 V 140 H 410 V 110 Q 410 100 420 100" fill="#e4f1e6"/><text x="426" y="127" class="name">BRANCH</text><text x="426" y="164" class="field">PK BranchID</text><text x="426" y="184" class="field">UNIQUE IFSCCode</text><text x="426" y="204" class="field">BranchName, City, State, ...</text><rect x="60" y="290" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 70 290 H 330 Q 340 290 340 300 V 330 H 60 V 300 Q 60 290 70 290" fill="#e4f1e6"/><text x="76" y="317" class="name">EMPLOYEE</text><text x="76" y="354" class="field">PK EmployeeID</text><text x="76" y="374" class="field">FK BranchID</text><text x="76" y="394" class="field">EmployeeName, Salary, ...</text><rect x="650" y="290" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 660 290 H 920 Q 930 290 930 300 V 330 H 650 V 300 Q 650 290 660 290" fill="#e4f1e6"/><text x="666" y="317" class="name">ACCOUNT</text><text x="666" y="354" class="field">PK AccountID · UNIQUE AccountNumber</text><text x="666" y="374" class="field">FK BranchID</text><text x="666" y="394" class="field">Balance, AccountType, Status, ...</text><rect x="40" y="550" width="270" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 50 550 H 300 Q 310 550 310 560 V 590 H 40 V 560 Q 40 550 50 550" fill="#e4f1e6"/><text x="56" y="577" class="name">CUSTOMER</text><text x="56" y="614" class="field">PK CustomerID · UNIQUE Email</text><text x="56" y="634" class="field">FirstName, LastName, DateOfBirth, ...</text><text x="56" y="654" class="field">Mobile, Address, City, ...</text><rect x="350" y="550" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 360 550 H 620 Q 630 550 630 560 V 590 H 350 V 560 Q 350 550 360 550" fill="#e4f1e6"/><text x="366" y="577" class="name">ACCOUNT_HOLDER</text><text x="366" y="614" class="field">PK (CustomerID, AccountID)</text><text x="366" y="634" class="field">FK CustomerID · FK AccountID</text><text x="366" y="654" class="field">HolderSince, HolderType</text><rect x="650" y="550" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 660 550 H 920 Q 930 550 930 560 V 590 H 650 V 560 Q 650 550 660 550" fill="#e4f1e6"/><text x="666" y="577" class="name">BANK_TRANSACTION</text><text x="666" y="614" class="field">PK TransactionID · FK AccountID</text><text x="666" y="634" class="field">Amount, Type, Date, Reference, ...</text><text x="666" y="654" class="field">UNIQUE (ReferenceNumber, Type)</text><rect x="650" y="760" width="280" height="130" rx="10" fill="white" stroke="#d6e2d9"/><path d="M 660 760 H 920 Q 930 760 930 770 V 800 H 650 V 770 Q 650 760 660 760" fill="#e4f1e6"/><text x="666" y="787" class="name">BALANCE_AUDIT</text><text x="666" y="824" class="field">PK AuditID · FK AccountID</text><text x="666" y="844" class="field">OldBalance, NewBalance, ChangedAt</text><text x="666" y="864" class="field">Extra table for audit trigger</text><text x="40" y="800" class="sub">Customer ↔ Account is many-to-many,</text><text x="40" y="823" class="sub">resolved through ACCOUNT_HOLDER.</text><text x="40" y="866" class="sub">PK = primary key · FK = foreign key</text><text x="40" y="889" class="sub">Account-with-holder rule is enforced by the app.</text></svg>